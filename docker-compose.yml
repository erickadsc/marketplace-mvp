services:
  db:
    image: postgres:17-alpine
    container_name: marketplace_mvp_db
    environment:
      POSTGRES_DB: reverse_real_estate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: marketplace_mvp_web
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reverse_real_estate
      JWT_SECRET: troque-por-uma-chave-segura
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
